<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <title>Recartly — нет соединения</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f7f7f8;
            color: #18181b;
            text-align: center;
        }
        @media (prefers-color-scheme: dark) {
            body { background: #101013; color: #eeeef0; }
            .card { background: #18181b !important; border-color: #27272a !important; }
            p { color: #9a9aa3 !important; }
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: #fff;
            border: 1px solid #e2e2e5;
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 8px 24px rgba(24, 24, 27, 0.08);
        }
        .logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 22px;
            display: grid;
            place-items: center;
            font-size: 36px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #fb923c, #c2410c);
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.38);
        }
        h1 { font-size: 22px; margin: 0 0 8px; }
        p { margin: 0 0 20px; color: #6f6f79; font-size: 15px; line-height: 1.5; }
        button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            background: #f97316;
            cursor: pointer;
        }
        button:active { background: #ea580c; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">R</div>
        <h1>Нет подключения</h1>
        <p>
            Recartly не может связаться с сервером. Проверьте интернет — сохранённые
            страницы останутся доступны, как только соединение вернётся.
        </p>
        <button onclick="location.reload()">Повторить</button>
    </div>
</body>
</html>
